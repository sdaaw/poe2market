name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes. GitHub queues cron jobs on a best-effort basis, so treat
    # this as "roughly half-hourly" rather than a guarantee.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Allow one deploy at a time; let a running one finish rather than cancelling it
# half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  # write, because each run commits the day's prices back into public/history —
  # the repository is the only thing that persists between runs.
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the build and the site are both plain Node/ESM.
      - name: Fetch the economy
        run: node scripts/snapshot.js

      # "[skip ci]" matters: without it this push would retrigger the workflow's
      # own push trigger and the job would run itself forever.
      - name: Record price history
        run: |
          if [ -z "$(git status --porcelain public/history)" ]; then
            echo "History unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/history
          git commit -m "Record economy snapshot for $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "History pushed."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run) — retrying."
            sleep 5
          done
          # A lost history commit is recoverable next run; a blocked deploy is not.
          echo "::warning::Could not push history after 3 attempts. Deploying anyway."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
